[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "acmeworks-mcp"
version = "0.1.0"
description = "MCP adapter for the fictional AcmeWorks workforce demo"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "mcp==2.0.0",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pytest-asyncio>=1.2,<2",
  "pytest>=9.0.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/security_scan.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install --upgrade "pip>=26.1.2" pip-audit
      - run: pip install "./services/demo-core-api"
      - run: pip install "./services/ai-api"
      - run: pip install "./services/acmeworks-mcp"
      - run: pip-audit --local
      - run: npm ci
        working-directory: apps/web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [demo-core-api, ai-api, acmeworks-mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "./services/${{ matrix.service }}[test]"
      - run: pytest
        working-directory: services/${{ matrix.service }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose up --build -d
      - run: |
          for attempt in {1..60}; do
            curl --fail --silent http://localhost:3000/api/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npm run test:e2e
        working-directory: apps/web
      - if: always()
        run: docker compose down -v
